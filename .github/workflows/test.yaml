# MANAGED by EpiAwarePackageTools.scaffold — do not edit by hand.
name: Test

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: EpiAware/.github/.github/workflows/tests.yml@2c7ce73459772f11dad46ac7f456e35f0d296faf
    with:
      # The managed standard needs Julia 1.11: `[sources]` (how test/Project.toml
      # pins the kit to main) is a Pkg 1.11 feature, and on 1.10 it is silently
      # ignored — the job then resolves the registered kit rather than the
      # pinned rev and tests a stale kit while appearing to test this one
      # (#246). The reusable defaults to ["1", "lts", "pre"]; drop the lts leg.
      julia_versions: '["1", "pre"]'
      # Collect coverage on the ubuntu leg that already runs the whole
      # suite and upload it, rather than running a second full suite just
      # for coverage. The reusable's `fail_ci_if_error` defaults to true,
      # so a repo with no CODECOV_TOKEN still goes red rather than green
      # with silently missing coverage; that is org policy and is left at
      # the default rather than restated here.
      upload_coverage: true
    secrets: inherit  # pragma: allowlist secret
