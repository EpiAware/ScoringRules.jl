<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 231" width="200" height="231"
     role="img" aria-label="ScoringRules.jl logo">
  <title>ScoringRules.jl logo</title>
  <!-- The CRPS picture (forecast CDF vs the observation's step function, the area
       between them — the score itself — shaded) inside the Julia-package hexagon,
       styled to match the EpiAware / epiforecasts ecosystem. The observation sits
       at the centre so both halves of the CRPS area read equally: the region under
       the CDF to its left, and over the CDF to its right. -->
  <defs>
    <linearGradient id="crps" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4063d8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#389826" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- hexagon frame -->
  <path d="M100 3 L8 60.75 L8 170.25 L100 228 L192 170.25 L192 60.75 Z"
        fill="#1a1a2e" stroke="#e8e8f0" stroke-width="5" stroke-linejoin="round"/>

  <!-- CRPS area between the CDF and the step: under the CDF left of the
       observation, over the CDF to its right -->
  <path d="M50 172 C 115 172, 85 68, 150 68 L 100 68 L 100 172 Z"
        fill="url(#crps)"/>

  <!-- forecast CDF F(x): a symmetric S centred on the observation -->
  <path d="M50 172 C 115 172, 85 68, 150 68"
        fill="none" stroke="#4063d8" stroke-width="8"
        stroke-linecap="round"/>

  <!-- observation step function 1{x >= y} -->
  <path d="M50 172 L 100 172 L 100 68 L 150 68"
        fill="none" stroke="#cb3c33" stroke-width="6.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the observation y -->
  <circle cx="100" cy="172" r="8" fill="#cb3c33" stroke="#1a1a2e" stroke-width="2.5"/>
</svg>
