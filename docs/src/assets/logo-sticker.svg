<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 231" width="200" height="231"
     role="img" aria-label="ScoringRules.jl hex sticker">
  <title>ScoringRules.jl</title>
  <!-- Hex-sticker form of the logo: the CRPS picture in the upper part of the
       hexagon and the "ScoringRules.jl" wordmark in the bottom band, matching the
       Julia hex-sticker convention (cf. epiforecasts/EpiBranch.jl). The graphic-only
       mark in logo.svg is used for the docs sidebar, where the framework already
       renders the package name; this sticker is for README heroes, slides and
       actual stickers. -->
  <defs>
    <linearGradient id="crps" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4063d8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#389826" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- hexagon frame -->
  <path d="M100 3 L8 60.75 L8 170.25 L100 228 L192 170.25 L192 60.75 Z"
        fill="#1a1a2e" stroke="#e8e8f0" stroke-width="5" stroke-linejoin="round"/>

  <!-- CRPS area between the CDF and the step -->
  <path d="M60 148 C 111 148, 89 48, 140 48 L 100 48 L 100 148 Z"
        fill="url(#crps)"/>

  <!-- forecast CDF F(x): a symmetric S centred on the observation -->
  <path d="M60 148 C 111 148, 89 48, 140 48"
        fill="none" stroke="#4063d8" stroke-width="7.5"
        stroke-linecap="round"/>

  <!-- observation step function 1{x >= y} -->
  <path d="M60 148 L 100 148 L 100 48 L 140 48"
        fill="none" stroke="#cb3c33" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the observation y -->
  <circle cx="100" cy="148" r="7" fill="#cb3c33" stroke="#1a1a2e" stroke-width="2.5"/>

  <!-- wordmark in the bottom band -->
  <text x="100" y="187" text-anchor="middle"
        font-family="'DejaVu Sans', Helvetica, Arial, sans-serif"
        font-weight="700" font-size="14" letter-spacing="0"
        fill="#e8e8f0">ScoringRules.jl</text>
</svg>
